name: Build LocalDrop release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.41.9'

concurrency:
  group: localdrop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        name: Validate release version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag must match app version: v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  windows:
    needs: [checks, version]
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Configure FOSS build
        shell: bash
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify FOSS dependency graph
        shell: bash
        run: sh support/scripts/remove_proprietary_dependencies.sh --check-resolved
      - name: Build Windows app
        working-directory: app
        run: flutter build windows --release --no-pub
      - name: Package portable Windows app
        shell: pwsh
        run: |
          $bundle = 'app/build/windows/x64/runner/Release'
          Copy-Item -LiteralPath LICENSE, NOTICE -Destination $bundle
          Copy-Item support/build/windows/x64/*.dll -Destination $bundle
          '{}' | Set-Content -Encoding utf8 "$bundle/settings.json"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/LocalDrop-${{ needs.version.outputs.version }}-windows-x86-64.zip'
      - uses: actions/upload-artifact@v6
        with:
          name: LocalDrop-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: [checks, version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Configure FOSS build
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify FOSS dependency graph
        shell: bash
        run: sh support/scripts/remove_proprietary_dependencies.sh --check-resolved
      - name: Build Linux app
        working-directory: app
        run: flutter build linux --release --no-pub
      - name: Package Linux app and AirDrop bridge
        shell: bash
        run: |
          BUNDLE=app/build/linux/x64/release/bundle
          cp LICENSE NOTICE "$BUNDLE/"
          cp -R support/airdrop "$BUNDLE/airdrop"
          mkdir -p dist
          tar -czf 'dist/LocalDrop-${{ needs.version.outputs.version }}-linux-x86-64.tar.gz' -C "$BUNDLE" .
      - uses: actions/upload-artifact@v6
        with:
          name: LocalDrop-linux
          path: dist/*
          if-no-files-found: error

  android:
    needs: [checks, version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Configure FOSS build
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Configure LocalDrop APK signing key
        shell: bash
        env:
          LOCALDROP_ANDROID_KEYSTORE: ${{ secrets.LOCALDROP_ANDROID_KEYSTORE }}
          LOCALDROP_ANDROID_KEY_PASSWORD: ${{ secrets.LOCALDROP_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$LOCALDROP_ANDROID_KEYSTORE" || -z "$LOCALDROP_ANDROID_KEY_PASSWORD" ]]; then
            echo 'Set LOCALDROP_ANDROID_KEYSTORE and LOCALDROP_ANDROID_KEY_PASSWORD repository secrets before building APKs.' >&2
            exit 1
          fi
          printf '%s' "$LOCALDROP_ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/localdrop.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=localdrop\n' \
            "$RUNNER_TEMP/localdrop.jks" "$LOCALDROP_ANDROID_KEY_PASSWORD" "$LOCALDROP_ANDROID_KEY_PASSWORD" \
            > app/android/key.properties
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify FOSS dependency graph
        shell: bash
        run: sh support/scripts/remove_proprietary_dependencies.sh --check-resolved
      - name: Build Android APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi --no-pub
      - name: Name APKs
        shell: bash
        run: |
          mkdir -p dist
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            cp "app/build/app/outputs/flutter-apk/app-$ABI-release.apk" \
              "dist/LocalDrop-${{ needs.version.outputs.version }}-android-$ABI.apk"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: LocalDrop-android
          path: dist/*
          if-no-files-found: error

  macos:
    needs: [checks, version]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Configure FOSS build
        run: sh support/scripts/remove_proprietary_dependencies.sh
      - name: Disable developer signing for community bundle
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('app/macos/Runner.xcodeproj/project.pbxproj')
          s = p.read_text()
          s = re.sub(r'CODE_SIGN_STYLE = (Automatic|Manual);',
                     'CODE_SIGN_STYLE = Manual; CODE_SIGNING_ALLOWED = NO; CODE_SIGNING_REQUIRED = NO;', s)
          p.write_text(s)
          PY
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Verify FOSS dependency graph
        shell: bash
        run: sh support/scripts/remove_proprietary_dependencies.sh --check-resolved
      - name: Build macOS app
        working-directory: app
        run: flutter build macos --release --no-pub
      - name: Apply and verify local ad-hoc signatures
        shell: bash
        run: |
          # Apple Silicon requires valid code signatures. Ad-hoc signatures
          # provide that integrity check without a Developer ID or notarization.
          APP=app/build/macos/Build/Products/Release/LocalDrop.app
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          for source, name in [
              ('app/macos/Runner/Release.entitlements', 'localdrop-main.entitlements'),
              ('app/macos/ShareExtension/ShareExtension.entitlements', 'localdrop-share.entitlements'),
          ]:
              entitlements = plistlib.loads(Path(source).read_bytes())
              groups = entitlements.get('com.apple.security.application-groups', [])
              entitlements['com.apple.security.application-groups'] = [
                  group.replace('$(AppIdentifierPrefix)', '').replace('$(TeamIdentifierPrefix)', '')
                  for group in groups
              ]
              Path(os.environ['RUNNER_TEMP'], name).write_bytes(plistlib.dumps(entitlements))
          PY
          while IFS= read -r -d '' LIBRARY; do
            codesign --force --sign - --timestamp=none "$LIBRARY"
          done < <(find "$APP" -type f -name '*.dylib' -print0)
          while IFS= read -r -d '' FRAMEWORK; do
            codesign --force --sign - --timestamp=none "$FRAMEWORK"
          done < <(find "$APP" -depth -type d -name '*.framework' -print0)
          while IFS= read -r -d '' EXTENSION; do
            codesign --force --sign - --timestamp=none \
              --entitlements "$RUNNER_TEMP/localdrop-share.entitlements" "$EXTENSION"
          done < <(find "$APP" -depth -type d -name '*.appex' -print0)
          codesign --force --sign - --timestamp=none \
            --entitlements "$RUNNER_TEMP/localdrop-main.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Check macOS app startup
        shell: bash
        run: |
          APP=app/build/macos/Build/Products/Release/LocalDrop.app
          "$APP/Contents/MacOS/LocalDrop" > "$RUNNER_TEMP/localdrop-startup.log" 2>&1 &
          APP_PID=$!
          sleep 10
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/localdrop-startup.log"
            echo 'LocalDrop exited during macOS startup.' >&2
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" || true
      - name: Package community macOS app
        run: |
          mkdir -p dist/package
          cp -R app/build/macos/Build/Products/Release/LocalDrop.app dist/package/
          cp LICENSE NOTICE dist/package/
          ditto -c -k --sequesterRsrc --keepParent dist/package \
            'dist/LocalDrop-${{ needs.version.outputs.version }}-macos-arm-64.zip'
          rm -rf dist/package
      - uses: actions/upload-artifact@v6
        with:
          name: LocalDrop-macos
          path: dist/*.zip
          if-no-files-found: error

  cli:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86-64
          - os: windows-latest
            platform: windows-x86-64
          - os: macos-14
            platform: macos-arm-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build LocalDrop CLI
        run: cargo build --locked --release --package localsend-cli --bin localdrop-cli
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/localdrop-cli LICENSE NOTICE dist/package/
          if [[ "$RUNNER_OS" == Linux ]]; then
            cp -R support/airdrop dist/package/airdrop
          fi
          tar -czf 'dist/LocalDrop-CLI-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tar.gz' -C dist/package .
      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item -LiteralPath target/release/localdrop-cli.exe, LICENSE, NOTICE -Destination dist/package
          Compress-Archive -Path dist/package/* -DestinationPath 'dist/LocalDrop-CLI-${{ needs.version.outputs.version }}-${{ matrix.platform }}.zip'
      - uses: actions/upload-artifact@v6
        with:
          name: LocalDrop-CLI-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
